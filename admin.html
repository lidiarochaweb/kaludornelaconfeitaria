<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de leads | Kalu Dornela</title>
<style>body{margin:0;font:15px/1.5 system-ui,Arial,sans-serif;background:#f6f3ec;color:#2b2a22}header{background:#3f4c36;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}main{padding:20px 24px}input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #c9c3b2;background:#fff}button{background:#654b26;color:#fff;border:0;cursor:pointer}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.w{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:.9rem}th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#75644b}pre{margin:0;white-space:pre-wrap;font:inherit}#lg{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;display:grid;gap:12px}</style></head><body>
<div id="lg"><h2 style="margin:0">Painel de leads</h2><input id="pw" type="password" placeholder="Senha do painel"><button id="go">Entrar</button><small id="er" style="color:#a33"></small></div>
<div id="ap" hidden><header><b>Leads · Kalu Dornela</b><span id="ct"></span></header><main><div class="bar"><input id="q" placeholder="Buscar por nome, telefone ou e-mail"><select id="ft"><option value="">Todos os tipos</option><option>encomenda</option><option>evento</option><option>orçamento</option><option>contato</option></select><button id="cv">Exportar CSV</button></div><div class="w"><table><thead><tr><th>Data</th><th>Nome</th><th>WhatsApp</th><th>E-mail</th><th>Tipo</th><th>Detalhes</th><th>Status</th><th>Observações</th></tr></thead><tbody id="tb"></tbody></table></div></main></div>
<script>
var S=["Novo contato","Em atendimento","Orçamento enviado","Aguardando resposta","Pedido confirmado","Concluído"],D=[],P="",$=function(i){return document.getElementById(i)};
function api(m,b){return fetch("/api/leads",{method:m,headers:{"x-admin-password":P,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined})}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function draw(){var q=$("q").value.toLowerCase(),f=$("ft").value,r=D.filter(function(l){return(!f||l.tipo===f)&&(!q||[l.nome,l.whatsapp,l.email].join(" ").toLowerCase().indexOf(q)>-1)});$("ct").textContent=r.length+" contato(s)";
$("tb").innerHTML=r.map(function(l){var tel=(l.whatsapp||"").replace(/\D/g,"");return "<tr><td>"+new Date(l.created_at).toLocaleString("pt-BR")+"</td><td>"+esc(l.nome)+"</td><td>"+(tel?'<a href="https://wa.me/'+(tel.length<=11?"55":"")+tel+'" target="_blank">'+esc(l.whatsapp)+"</a>":"")+"</td><td>"+esc(l.email)+"</td><td>"+esc(l.tipo)+"<br><small>"+esc(l.origem)+"</small></td><td><pre>"+esc(l.detalhes)+"</pre></td><td><select data-id=\""+l.id+"\" data-f=\"status\">"+S.map(function(s){return "<option"+(s===l.status?" selected":"")+">"+s+"</option>"}).join("")+"</select></td><td><input data-id=\""+l.id+"\" data-f=\"notas\" value=\""+esc(l.notas).replace(/\"/g,"&quot;")+"\"></td></tr>"}).join("");
document.querySelectorAll("[data-id]").forEach(function(e){e.onchange=function(){var b={id:e.dataset.id};b[e.dataset.f]=e.value;api("PATCH",b)}})}
function load(){api("GET").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;$("lg").hidden=true;$("ap").hidden=false;sessionStorage.k=P;draw()}).catch(function(){$("er").textContent="Senha inválida ou servidor não configurado.";sessionStorage.removeItem("k")})}
$("go").onclick=function(){P=$("pw").value;load()};$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("q").oninput=draw;$("ft").onchange=draw;
$("cv").onclick=function(){var c=[["Data","Nome","WhatsApp","E-mail","Tipo","Origem","Detalhes","Status","Observações"]].concat(D.map(function(l){return[l.created_at,l.nome,l.whatsapp,l.email,l.tipo,l.origem,l.detalhes,l.status,l.notas]}));var t=c.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="leads-kalu-dornela.csv";a.click()};
if(sessionStorage.k){P=sessionStorage.k;load()}
</script></body></html>
